<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div id="app-header"></div>

    <!-- ================= FORMULARIO DE REGISTRO ================= -->
    <section class="container my-5" style="max-width: 600px;">

        <div class="text-center mb-4">
            <h1 class="h3 fw-bold">Crear una cuenta</h1>
            <p class="text-muted">Únete a Cecy-Jobs y encuentra oportunidades</p>
        </div>

        <div id="alert-container"></div>

        <form id="registro-form" class="card shadow-sm p-4" novalidate>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo *</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico *</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" id="telefono" name="telefono" class="form-control" placeholder="Opcional">
            </div>

            <div class="mb-3">
                <label for="rol" class="form-label">Quiero registrarme como *</label>
                <select id="rol" name="rol" class="form-select" required>
                    <option value="buscador" selected>Busco empleo</option>
                    <option value="empleador">Ofrezco empleo</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña *</label>
                <input type="password" id="password" name="password" class="form-control" minlength="6" required>
                <div class="form-text">Mínimo 6 caracteres.</div>
            </div>

            <div class="mb-3">
                <label for="confirmar" class="form-label">Confirmar contraseña *</label>
                <input type="password" id="confirmar" name="confirmar" class="form-control" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-plus"></i> Registrarme
            </button>

            <p class="text-center text-muted mt-3 mb-0 small">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
        </form>
    </section>

    <div id="app-footer"></div>

    <script src="app.js"></script>
    <script>
        renderLayout("registro.html");
        const alertContainer = document.getElementById("alert-container");

        document.getElementById("registro-form").addEventListener("submit", function(ev) {
            ev.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const email = document.getElementById("email").value.trim();
            const telefono = document.getElementById("telefono").value.trim();
            const rol = document.getElementById("rol").value;
            const password = document.getElementById("password").value;
            const confirmar = document.getElementById("confirmar").value;

            const errores = [];

            if (nombre === "") {
                errores.push("El nombre es obligatorio.");
            } else if (nombre.length < 3) {
                errores.push("El nombre debe tener al menos 3 caracteres.");
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === "") {
                errores.push("El email es obligatorio.");
            } else if (!emailRegex.test(email)) {
                errores.push("El email no tiene un formato válido.");
            }

            if (password === "") {
                errores.push("La contraseña es obligatoria.");
            } else if (password.length < 6) {
                errores.push("La contraseña debe tener al menos 6 caracteres.");
            }

            if (password !== confirmar) {
                errores.push("Las contraseñas no coinciden.");
            }

            if (!["buscador", "empleador"].includes(rol)) {
                errores.push("Rol inválido.");
            }

            const db = getDB();
            if (errores.length === 0) {
                const existe = db.usuarios.some(u => u.email.toLowerCase() === email.toLowerCase());
                if (existe) {
                    errores.push("Ya existe una cuenta con ese email.");
                }
            }

            if (errores.length > 0) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <ul class="mb-0">
                            ${errores.map(e => `<li>${escapeHTML(e)}</li>`).join("")}
                        </ul>
                    </div>
                `;
                return;
            }

            const nuevoId = db.usuarios.length > 0 ? Math.max(...db.usuarios.map(u => u.id)) + 1 : 1;
            db.usuarios.push({
                id: nuevoId,
                nombre,
                email,
                password,
                telefono,
                rol
            });
            saveDB(db);

            window.location.href = "login.html?registro=ok";
        });
    </script>
</body>
</html>
