<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div id="app-header"></div>

    <!-- ================= FORMULARIO DE LOGIN ================= -->
    <section class="container my-5" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold">Iniciar Sesión</h1>
            <p class="text-muted">Ingresa a tu cuenta de Cecy-Jobs</p>
        </div>

        <div id="alert-container"></div>

        <form id="login-form" class="card shadow-sm p-4" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>

            <p class="text-center text-muted mt-3 mb-0 small">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </form>
    </section>

    <div id="app-footer"></div>

    <script src="app.js"></script>
    <script>
        if (getSession()) {
            window.location.href = "index.html";
        }

        renderLayout("login.html");
        const alertContainer = document.getElementById("alert-container");
        const params = new URLSearchParams(window.location.search);

        if (params.get("registro") === "ok") {
            alertContainer.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show">
                    <i class="bi bi-check-circle-fill"></i> ¡Cuenta creada con éxito! Ya puedes iniciar sesión.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        document.getElementById("login-form").addEventListener("submit", function(ev) {
            ev.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errores = [];

            if (email === "" || password === "") {
                errores.push("Por favor, ingresa tu correo y contraseña.");
            } else {
                const db = getDB();
                const usuario = db.usuarios.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
                if (usuario) {
                    setSession(usuario);
                    if (usuario.rol === "empleador") {
                        window.location.href = "publicar-empleo.html";
                    } else {
                        window.location.href = "empleos.html";
                    }
                    return;
                } else {
                    errores.push("Correo o contraseña incorrectos.");
                }
            }

            alertContainer.innerHTML = `
                <div class="alert alert-danger">
                    <ul class="mb-0">
                        ${errores.map(e => `<li>${escapeHTML(e)}</li>`).join("")}
                    </ul>
                </div>
            `;
        });
    </script>
</body>
</html>
